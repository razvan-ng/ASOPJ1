name: Generar el lloc

# Quan afegeixes o edites contingut (una carpeta amb .md dins de contingut/),
# aquesta acció regenera les pàgines i la portada i torna a publicar el web.

on:
  push:
    branches: [main]
    paths:
      - 'contingut/**'
      - 'tasques.json'
      - 'tools/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar pàgines des de contingut/
        run: node tools/build.mjs

      - name: Publicar els canvis (si n'hi ha)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Regenera el lloc des del contingut"
            git push
          else
            echo "Cap canvi a generar."
          fi
          # Força la reconstrucció del GitHub Pages (origen: branca).
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds" || true
